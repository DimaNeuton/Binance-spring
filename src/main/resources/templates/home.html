<!DOCTYPE html>
<!--<html lang="en">-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Title</title>
</head>
<script th:inline="javascript">
    const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.p) {
            document.getElementById('price').textContent = data.p;
        }
    };
    ws.onerror = () => console.error('WebSocket error');
    ws.onclose = () => console.warn('WebSocket closed');
</script>
<body>
    <h1>Welcome to...</h1>
<!--    <img th:src="@{/images/ata-logo.png}"/>-->
    <span id="price">—</span>
    <h1>DB Balance</h1>
    <h2>BTC</h2>
    <h3 id="btcDB" th:text="${balanceDB.btc}">—</h3>
    <h2>USDT</h2>
    <h3 id="usdtDB" th:text="${balanceDB.usdt}">—</h3>
    <h2>BNB</h2>
    <h3 id="bnbDB" th:text="${balanceDB.bnb}">—</h3>
    <h1>Real Balance</h1>
    <h2>BTC</h2>
    <h3 id="btcReal" th:text="${balanceReal.btc}">—</h3>
    <h2>USDT</h2>
    <h3 id="usdtReal" th:text="${balanceReal.usdt}">—</h3>
    <h2>BNB</h2>
    <h3 id="bnbReal" th:text="${balanceReal.bnb}">—</h3>
    <h1>Ручная сделка</h1>
    <p th:if="${orderMessage}" th:text="${orderMessage}" style="color: green;"></p>
    <p th:if="${orderError}" th:text="${orderError}" style="color: red;"></p>
    <form method="POST" th:action="@{/order}">
        <label for="quantity">Объём (BTC)</label>
        <input id="quantity" type="number" name="quantity" step="0.00001" min="0.00001" required/>
        <button type="submit" name="side" value="BUY">Купить</button>
        <button type="submit" name="side" value="SELL">Продать</button>
    </form>
    <form method="POST" th:object="${daysNumber}">
        <div>
            <h3>Количество дней для выборки</h3>
            <input type=number th:field="*{number}"/>
            <span class="validationError"
                  th:if="${#fields.hasErrors('number')}"
                  th:errors="*{number}">Number error</span>
            <br/>
            <button>Show history</button>
        </div>
    </form>
</body>
</html>
